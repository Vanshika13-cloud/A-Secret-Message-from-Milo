
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Secret Message from Milo 🐾</title>

<style>
body {
  background: #fff0f5;
  font-family: Georgia, serif;
  text-align: center;
  padding: 35px 18px;
  color: #593d4b;
}

.letter {
  max-width: 550px;
  margin: auto;
  background: white;
  padding: 28px;
  border-radius: 20px;
  box-shadow: 0 5px 25px #eacbd8;
}

h1 { color: #b85c87; }

button {
  background: #dc85aa;
  color: white;
  border: none;
  padding: 15px 24px;
  border-radius: 30px;
  font-size: 16px;
  cursor: pointer;
  margin: 20px 0;
}

button:hover { background: #bd6490; }

#woofs {
  width: 100%;
  box-sizing: border-box;
  height: 150px;
  padding: 12px;
  border: 1px solid #eacbd8;
  border-radius: 12px;
  background: #fff9fc;
  overflow-wrap: anywhere;
  resize: vertical;
}

#secret {
  display: none;
  white-space: pre-wrap;
  text-align: left;
  line-height: 1.8;
  padding: 20px;
  background: #fff9fc;
  border-radius: 12px;
}
</style>
</head>

<body>
<div class="letter">
  <h1>🐶 A Secret Message from Milo</h1>
  <p>I have something very important to tell you...</p>
  <p>But I only speak dog! 🐾</p>

  <p>Can you translate my woofs?</p>

  <textarea id="woofs"
    placeholder="Paste Milo's secret woofs here..."></textarea>

  <button onclick="generate()">
  🐶 Generate Milo's Woofs 🐾
  </button>

  <button onclick="decode()">
    🐾 Decode Milo's Message 🐾
  </button>

  <div id="secret"></div>
</div>


<script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>

<script>

<script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>

<script>
  async function generate() {
  const woofs = document.getElementById("woofs");
  const secret = document.getElementById("secret");

  try {
    const response = await fetch("./milo-secret.txt");

    if (!response.ok) {
      throw new Error("Secret letter file not found");
    }

    woofs.value = (await response.text()).trim();

    secret.textContent = "";
    secret.style.display = "none";

  } catch (error) {
    alert("Milo's secret letter could not be loaded. 🐶");
  }
}
function decode() {
  const secret = document.getElementById("secret");

  try {
    const sounds = ["woof", "arf", "ruff", "yip"];
    const alphabet =
      "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_";

    const tokens = document.getElementById("woofs")
      .value.trim().split(/\s+/);

    if (!tokens.length || !tokens[0]) {
      throw new Error("Empty message");
    }

    const base64url = tokens.map(token => {
      const parts = token.toLowerCase().split("-");

      if (parts.length !== 3) {
        throw new Error("Invalid bark");
      }

      const digits = parts.map(s => sounds.indexOf(s));

      if (digits.includes(-1)) {
        throw new Error("Unknown bark");
      }

      return alphabet[
        digits[0] * 16 + digits[1] * 4 + digits[2]
      ];
    }).join("");

    const base64 = base64url
      .replace(/-/g, "+")
      .replace(/_/g, "/");

    const padded = base64.padEnd(
      Math.ceil(base64.length / 4) * 4, "="
    );

    const bytes = Uint8Array.from(
      atob(padded), c => c.charCodeAt(0)
    );

    secret.textContent = pako.inflate(
      bytes, {to: "string"}
    );

  } catch (e) {
    secret.textContent =
      "Oops! Milo couldn't understand those barks. Check that you copied the entire code. 🐶";
  }

  secret.style.display = "block";
}
</script>
</body>
</html>
