
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Secret Message from Milo 🐾</title>

<style>
body {
  background: #fff0f5;
  font-family: Georgia, serif;
  text-align: center;
  padding: 35px 18px;
  color: #593d4b;
}

.letter {
  max-width: 550px;
  margin: auto;
  background: white;
  padding: 28px;
  border-radius: 20px;
  box-shadow: 0 5px 25px #eacbd8;
}

h1 { color: #b85c87; }

button {
  background: #dc85aa;
  color: white;
  border: none;
  padding: 15px 24px;
  border-radius: 30px;
  font-size: 16px;
  cursor: pointer;
  margin: 20px 0;
}

button:hover { background: #bd6490; }

#woofs {
  width: 100%;
  box-sizing: border-box;
  height: 150px;
  padding: 12px;
  border: 1px solid #eacbd8;
  border-radius: 12px;
  background: #fff9fc;
  overflow-wrap: anywhere;
  resize: vertical;
}

#secret {
  display: none;
  white-space: pre-wrap;
  text-align: left;
  line-height: 1.8;
  padding: 20px;
  background: #fff9fc;
  border-radius: 12px;
}
</style>
</head>

<body>
<div class="letter">
  <h1>🐶 A Secret Message from Milo</h1>
  <p>I have something very important to tell you...</p>
  <p>But I only speak dog! 🐾</p>

  <p>Can you translate my woofs?</p>

  <textarea id="woofs"
    placeholder="Paste Milo's secret woofs here..."></textarea>

  <button onclick="decode()">
    🐾 Decode Milo's Message 🐾
  </button>

  <div id="secret"></div>
</div>

<script>
function decode() {
  const code = document.getElementById("woofs").value;
  const secret = document.getElementById("secret");

  try {
    const groups = code.trim().split(/\s*\|\s*/);

    const numbers = groups.map(group => {
      const sounds = group.trim().split(/\s+/);

      if (sounds.length !== 8 ||
          sounds.some(s => s !== "woof" && s !== "WOOF")) {
        throw new Error("Invalid woof code");
      }

      const binary = sounds.map(sound =>
        sound === "WOOF" ? "1" : "0"
      ).join("");

      return parseInt(binary, 2);
    });

    const decoded = new TextDecoder(
      "utf-8", {fatal: true}
    ).decode(new Uint8Array(numbers));

    secret.textContent = decoded;
    secret.style.display = "block";

  } catch (error) {
    secret.textContent =
      "Oops! Milo couldn't understand those woofs. 🐶";
    secret.style.display = "block";
  }
}
</script>
</body>
</html>
